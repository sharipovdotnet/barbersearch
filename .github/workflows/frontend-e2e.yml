name: frontend-e2e

# Сквозные браузерные тесты frontend (Playwright + axe): реальный API, реальный
# PostgreSQL и отдельная БД barbersearch_e2e. Быстрый frontend-ci (lint/build)
# этот job не замедляет: он отдельный и запускается только по своим путям.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/frontend-e2e.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/frontend-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Строка подключения одна на все шаги: миграции, seed, API и psql.
  PGPASSWORD: postgres
  ConnectionStrings__Postgres: 'Host=localhost;Port=5432;Database=barbersearch_e2e;Username=postgres;Password=postgres'

jobs:
  e2e:
    name: Playwright and axe
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # Та же мажорная версия, что в backend/docker-compose.yml.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: barbersearch_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d barbersearch_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # Письма подтверждения email: E2E читает настоящий инбокс из API Mailpit.
      # SMTP — 1025 (его ждёт API), HTTP-UI и API — 8025.
      mailpit:
        image: axllent/mailpit:v1.21.8
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -q --spider http://localhost:8025/api/v1/info || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            backend/**/*.csproj
            backend/global.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # dotnet-ef нужен для миграций; версия совпадает с локальной (AGENT.md §5).
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.10

      # psql не ставится из apt: зеркала Ubuntu на раннере могут быть недоступны, и
      # job падал до первого теста. Образ postgres:18 уже поднят как сервис-контейнер,
      # поэтому seed выполняется его клиентом; --network host даёт доступ к порту 5432.
      - name: Build API
        working-directory: backend
        run: dotnet build BarberSearch/BarberSearch.sln --nologo

      - name: Apply migrations
        working-directory: backend
        run: >
          dotnet ef database update
          --project BarberSearch/src/BarberSearch.Infrastructure.Postgresql
          --startup-project BarberSearch/src/BarberSearch.Web
          --no-build

      # Оба seed-файла: базовые данные бэкенда и фикстуры E2E (18 пользователей,
      # отзывы, записи). seed.sql сам откажется работать не с barbersearch_e2e.
      - name: Seed database
        run: |
          seed() {
            docker run --rm --network host \
              -e PGPASSWORD \
              -v "$GITHUB_WORKSPACE:/work:ro" \
              postgres:18 psql -h localhost -p 5432 -U postgres -d barbersearch_e2e \
              -v ON_ERROR_STOP=1 -q -f "$1"
          }
          seed /work/backend/load/seed/minimal.sql
          seed /work/frontend/e2e/fixtures/seed.sql

      # Ключ подписи токенов приходит только из окружения (backend/AGENT.md §5.5);
      # для одноразового стенда он генерируется на месте и нигде не хранится.
      - name: Generate test signing key
        run: echo "Auth__SigningKey=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      # Фото и аватары идут в MinIO, поэтому S3-ветка адаптера проверяется теми же
      # media-сценариями, что раньше проверяли локальный диск. Официальный
      # minio/minio удалён из Docker Hub, а quay.io/minio/minio с 2026-09-24 не
      # отдаётся анонимно: берём публичное зеркало с пин-тегом релиза. Это именно
      # dev/CI-хранилище, а не доверенная граница; настоящий S3 проверяется деплоем.
      #
      # Сервис-контейнером MinIO не поднять: у образа нет команды по умолчанию, а
      # GitHub Actions не позволяет переопределить command в services.
      - name: Start MinIO
        run: |
          docker run -d --name barbersearch-minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=barbersearch \
            -e MINIO_ROOT_PASSWORD=barbersearch-e2e \
            coollabsio/minio:RELEASE.2025-10-15T17-29-55Z \
            server /data --console-address ":9001"

      - name: Wait for MinIO
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO готов"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO не ответил на /minio/health/live за 60 с" >&2
          docker logs barbersearch-minio >&2 || true
          exit 1

      - name: Start API
        working-directory: backend
        env:
          ASPNETCORE_ENVIRONMENT: Development
          # Письма идут в сервис-контейнер Mailpit, а ссылка из письма ведёт на Vite.
          Email__Enabled: 'true'
          Email__Host: localhost
          Email__Port: '1025'
          Email__UseTls: 'false'
          Email__FromAddress: no-reply@barbersearch.test
          App__PublicUrl: http://localhost:5173
          # Письма уходят через outbox-воркер, а Playwright ждёт их 10 с. Дефолтные
          # 30 с дают флейк: письмо, поставленное сразу после тика, не успевает.
          EmailOutbox__IntervalSeconds: '1'
          # Хранилище — MinIO, а не диск: S3-ветка адаптера должна прогоняться
          # теми же media-сценариями. EnsureBucket=true создаёт бакет на старте,
          # поэтому отдельный шаг создания не нужен.
          Storage__Provider: S3
          Storage__S3__ServiceUrl: http://localhost:9000
          Storage__S3__Bucket: barbersearch
          Storage__S3__Region: us-east-1
          Storage__S3__ForcePathStyle: 'true'
          Storage__S3__EnsureBucket: 'true'
          Storage__S3__AccessKey: barbersearch
          Storage__S3__SecretKey: barbersearch-e2e
        run: |
          nohup dotnet run --project BarberSearch/src/BarberSearch.Web \
            --launch-profile http --no-build > "$RUNNER_TEMP/api.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:5243/health/ready > /dev/null; then
              echo "API готов"
              exit 0
            fi
            sleep 2
          done
          echo "API не ответил на /health/ready за 120 с" >&2
          tail -n 100 "$RUNNER_TEMP/api.log" >&2
          exit 1

      # Браузеры кэшируются по версии Playwright из lock-файла.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium
        working-directory: frontend
        run: |
          npx playwright install chromium
          # Системные библиотеки на образе раннера уже есть: apt — best-effort,
          # чтобы недоступность зеркал Ubuntu не валила job до первого теста.
          npx playwright install-deps chromium \
            || echo "::warning::install-deps failed, relying on preinstalled libraries"

      - name: Run E2E
        working-directory: frontend
        run: npm run test:e2e

      # Трейсы, скриншоты и html-отчёт нужны при падении: без них разбор дороже прогона.
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14

      - name: API log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/api.log"
