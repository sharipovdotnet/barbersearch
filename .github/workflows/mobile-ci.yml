name: mobile-ci

# Сборка и тесты мобильного клиента. Workflow лежит в корне репозитория, потому что
# GitHub Actions читает только .github/workflows из корня.
# Запускается только при изменениях mobile/ — правки backend/ и frontend/ его не трогают.
# Push проверяется только на main: feature-ветки идут через pull_request, иначе
# каждый пуш в PR запускал бы два одинаковых прогона.
#
# Android проверяется на каждом прогоне: его минуты бесплатны.
# iOS — отдельная джоба на macOS только по расписанию и вручную: macOS-минуты считаются
# с коэффициентом ×10 к лимиту, а компиляция iOS нужна не на каждую правку.
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  schedule:
    # Каждый понедельник в 03:00 UTC: одна проверка iOS в неделю.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Directory.Build.props включает ContinuousIntegrationBuild при CI=true.
  CI: true

jobs:
  android:
    name: Tests and Android build
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            mobile/**/*.csproj
            mobile/global.json

      # MAUI-нагрузки не входят в образ раннера: Android ставится явно.
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # Restore всего решения: тестам нужны те же пакеты, что и приложению.
      - name: Restore
        run: dotnet restore BarberSearch.Mobile.sln

      # Ядро проверяется без эмулятора: тесты не поднимают MAUI.
      - name: Tests
        run: >
          dotnet test tests/BarberSearch.Mobile.Core.Tests
          -c Release --no-restore --nologo --verbosity quiet

      # Debug, а не Release: цель шага — что приложение собирается. Release включает
      # trimming и AOT, это отдельный, более долгий прогон для релизных веток.
      - name: Build Android
        run: >
          dotnet build src/BarberSearch.Mobile/BarberSearch.Mobile.csproj
          -f net10.0-android -c Debug --no-restore --nologo

  ios:
    name: iOS build (compile only)
    # Только по расписанию и вручную: macOS-минуты дороже остальных.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      # Сборка под симулятор не требует сертификатов и профиля: проверяется компиляция
      # iOS-цели, а не подпись. Подпись и .ipa — отдельный шаг, когда появится Apple-аккаунт.
      - name: Build iOS
        run: >
          dotnet build src/BarberSearch.Mobile/BarberSearch.Mobile.csproj
          -f net10.0-ios -c Debug -p:RuntimeIdentifier=iossimulator-arm64 --nologo
